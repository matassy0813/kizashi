# Kizashi クラウド同期サーバーの設定（Cloudflare Workers）
# 公開：npx wrangler deploy --config cloud/wrangler.toml（Cloudflare の無料アカウントで動く）
name = "kizashi-cloud"
main = "worker.js"
compatibility_date = "2025-06-01"

[vars]
LOCATION_HINT = "apac" # データを置く地域の希望（アジア太平洋）
APP_URL = "https://matassy0813.github.io/kizashi/Kizashi.html" # このサーバーの URL を直接開いた人の案内先

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[durable_objects.bindings]]
name = "DIRECTORY"
class_name = "Directory"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Directory"]

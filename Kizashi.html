'use strict';
// ============ ダッシュボード ============
function renderDash(v, {b, m, alerts, rag, sev}){
  const S = state.settings, prev = prevSnapshot();
  const spiDelta = prev ? Math.round((m.spi - prev.spi) * 100) / 100 : null;
  const cnt = s => alerts.filter(a => a.sev === s).length;
  const openRaid = state.raid.filter(r => inScope(r) && r.status !== 'closed' && (r.type === 'risk' || r.type === 'issue'));
  const nextMs = scopedTasks().filter(t => t.milestone && !isDone(t) && d2n(t.end) >= b).sort((x, y) => d2n(x.end) - d2n(y.end))[0];
  const spiCls = m.spi < S.spiRed ? 'red' : m.spi < S.spiAmber ? 'amber' : 'green';
  const ms = meetingStats(b), gs = govStats();
  const pct = (a, n) => n ? Math.round(a / n * 100) : 100;
  const phaseCard = ui.scope ? phaseSummary(phaseOf(ui.scope), b, alerts) : '';
  v.innerHTML = `
  ${state.isSample ? `<div class="card banner" style="margin-bottom:14px">${t('dash.sample')} <button class="btn primary" data-wizard>${t('dash.start')}</button></div>` : ''}
  ${phaseCard}
  <div class="grid kpis">
    <div class="card kpi"><div class="lbl">${t('kpi.status')}</div><div class="val">${ragBadge(rag)}</div><div class="note">${t('kpi.asOf', ymd(baseDate()))}</div></div>
    <div class="card kpi"><div class="lbl">${t('kpi.progress')}</div><div class="val"><span data-count="${m.actual}">${m.actual}</span><small>%</small> <small>/ ${m.planned}%</small></div><div class="note ${m.actual < m.planned ? 'amber' : ''}">${t('kpi.variance', (m.actual - m.planned > 0 ? '+' : '') + (m.actual - m.planned))}</div></div>
    <div class="card kpi"><div class="lbl">${t('kpi.spi')}<button class="info" data-help-open="spi" title="${t('kpi.spiWhat')}" aria-label="${t('kpi.spiWhat')}">i</button></div><div class="val ${spiCls}"><span data-count="${m.spi}" data-dec="2">${m.spi.toFixed(2)}</span></div><div class="note">${spiDelta === null ? t('kpi.noPrev') : t('kpi.vsPrev', (spiDelta >= 0 ? '+' : '') + spiDelta.toFixed(2)) + (spiDelta < 0 ? ' ↓' : spiDelta > 0 ? ' ↑' : ' →')}</div></div>
    <div class="card kpi"><div class="lbl">${t('kpi.alerts')}</div><div class="val"><span class="red" data-count="${cnt('H')}">${cnt('H')}</span> <small>/ ${cnt('M')} / ${cnt('L')}</small></div><div class="note">${t('kpi.overdueN', alerts.filter(a => a.type === 'overdue').length)}</div></div>
    <div class="card kpi"><div class="lbl">${t('kpi.raid')}</div><div class="val"><span data-count="${openRaid.length}">${openRaid.length}</span></div><div class="note">${t('kpi.raidNote', openRaid.filter(r => r.impact === 'H').length, openRaid.filter(r => r.category === 'contract').length)}</div></div>
    <div class="card kpi"><div class="lbl">${t('kpi.nextMs')}</div><div class="val" style="font-size:16px">${nextMs ? esc(nextMs.name) : '—'}</div><div class="note ${nextMs && sev[nextMs.id] ? 'red' : ''}">${nextMs ? t('kpi.msNote', ymd(nextMs.end), d2n(nextMs.end) - b) + (sev[nextMs.id] ? ' ⚠ ' + t('kpi.msRisk') : '') : ''}</div></div>
    <div class="card kpi clickable" data-tab="meetings"><div class="lbl">${t('kpi.meetings')}</div><div class="val ${ms.overdue.length ? 'amber' : ''}"><span data-count="${pct(ms.recorded, ms.past.length)}">${pct(ms.recorded, ms.past.length)}</span><small>%</small></div><div class="note">${t('kpi.mtgNote', pct(ms.withAgenda, ms.upcoming.length), ms.overdue.length)}</div></div>
    <div class="card kpi clickable" data-tab="governance"><div class="lbl">${t('kpi.gov')}</div><div class="val ${gs.agreed < gs.total ? 'amber' : 'green'}"><span data-count="${gs.agreed}">${gs.agreed}</span><small> / ${gs.total}</small></div><div class="note">${t('kpi.govNote', gs.draft, gs.total - gs.agreed - gs.draft)}</div></div>
  </div>
  <div class="grid two" style="margin-top:14px">
    <div class="card"><h2>${ui.scope ? t('dash.taskProgress') : t('dash.phaseProgress')}<span class="hint">${t('dash.phaseHint')}</span></h2>${ui.scope ? taskBars(b, sev) : phaseBars(b)}
      <div class="legend"><span><i style="background:var(--plan)"></i>${t('lg.plan')}</span><span><i style="background:var(--accent)"></i>${t('lg.actual')}</span><span><i style="background:var(--amber)"></i>${t('lg.behind10')}</span><span><i style="background:var(--red)"></i>${t('lg.behind20')}</span></div></div>
    <div class="card"><h2>${t('dash.alerts')}<span class="hint">${t('dash.alertsHint')}</span></h2>${alertList(alerts.slice(0, 7))}
      ${alerts.length > 7 ? `<button class="btn ghost" data-tab="alerts">${t('dash.showAll', alerts.length)} →</button>` : ''}</div>
  </div>
  <div class="card" style="margin-top:14px"><h2>${t('dash.gantt')}<span class="hint">${t('dash.ganttHint')}</span></h2>${gantt(b, sev)}</div>
  <div class="grid two" style="margin-top:14px">
    <div class="card"><h2>${t('dash.upcomingMtg')}</h2>${upcomingMeetings(ms.upcoming.slice(0, 5), b, sev)}</div>
    <div class="card"><h2>${t('dash.raid')}</h2>${raidMini(openRaid)}</div>
  </div>
  <div class="grid two" style="margin-top:14px">
    <div class="card"><h2>${t('dash.trend')}<span class="hint">${t('dash.trendHint')}</span></h2>${trendChart(m)}</div>
    <div class="card"><h2>${t('dash.openActions')}</h2>${actionMini(ms.open, b)}</div>
  </div>`;
}
function phaseSummary(p, b, alerts){
  if (!p) return '';
  const {s, e} = phaseRange(p), ce = p.contractEnd;
  const pa = alerts.filter(a => a.phaseId === p.id && ['gateOverdue','gateNotReady','contractOverrun'].includes(a.type));
  return `<div class="card phase-head" style="margin-bottom:14px">
    <div class="ph-title"><span class="code">${esc(p.code)}</span><h2 style="margin:0">${esc(p.name)}</h2><span class="tag">${lbl('contract', p.contract)}</span><span class="gate ${p.gate}">${t('ph.gate')}：${lbl('gate', p.gate)}</span></div>
    <div class="ph-meta">
      <div><span class="muted">${t('ph.period')}</span> ${ymd(s)} 〜 ${ymd(e)}</div>
      <div><span class="muted">${t('ph.contract')}</span> ${esc(p.contractRef || '—')}${ce ? `（${t('ph.contractEndShort')} ${ymd(ce)}）` : ''}</div>
      <div><span class="muted">${t('ph.owner')}</span> ${esc(p.owner || '—')}</div>
    </div>
    ${pa.length ? `<div style="margin-top:8px">${pa.map(a => `<div class="red" style="font-size:13px">⚠ ${esc(t('at.' + a.type))}：${esc(a.detail)}</div>`).join('')}</div>` : ''}
  </div>`;
}
function bar(name, sub, m, done){
  const gap = m.planned - m.actual;
  const col = gap >= 20 ? 'var(--red)' : gap >= 10 ? 'var(--amber)' : done ? 'var(--done)' : 'var(--accent)';
  return `<div class="phase-row"><div class="nm">${name}<small>${sub}</small></div>
    <div class="track"><div class="pl" style="width:${m.planned}%"></div><div class="ac" style="width:${m.actual}%;background:${col}"></div></div>
    <div class="fig">${t('lg.actual')} <b>${m.actual}%</b> / ${t('lg.plan')} ${m.planned}%${gap > 0 ? ` <span class="${gap >= 20 ? 'red' : gap >= 10 ? 'amber' : 'muted'}">(-${gap})</span>` : ''}</div></div>`;
}
function phaseBars(b){
  if (!state.phases.length) return `<div class="empty">${t('empty.phases')}</div>`;
  return state.phases.map(p => {
    const ts = tasksOf(p.id), {s, e} = phaseRange(p);
    return bar(`<span class="link" data-scope="${p.id}">${esc(p.code)} ${esc(p.name)}</span>`, `${md(s)}〜${md(e)}　<span class="gate ${p.gate}">${lbl('gate', p.gate)}</span>`, metrics(ts, b), ts.length && ts.every(isDone));
  }).join('');
}
function taskBars(b, sev){
  const ts = scopedTasks().filter(t => !t.milestone);
  if (!ts.length) return `<div class="empty">${t('empty.tasks')}</div>`;
  return ts.map(x => bar(esc(x.name), `${esc(x.owner)} ${md(x.start)}〜${md(x.end)}`, {planned: plannedPct(x, b), actual: +x.progress || 0}, isDone(x))).join('');
}
function alertList(list){
  if (!list.length) return `<div class="empty">${t('empty.alerts')}</div>`;
  return `<ul class="alert-list">${list.map(a => `<li>${sevBadge(a.sev)}<div><div class="t">${esc(t('at.' + a.type))}：${esc(a.target)}</div><div class="d">${esc(a.detail)}${a.owner ? `　${t('col.owner')}：${esc(a.owner)}` : ''}${!ui.scope && a.phaseId ? `　[${esc(phaseName(a.phaseId))}]` : ''}</div></div></li>`).join('')}</ul>`;
}
function raidMini(list){
  if (!list.length) return `<div class="empty">${t('empty.raid')}</div>`;
  const sorted = [...list].sort((x, y) => (SEV_ORDER[x.impact] ?? 3) - (SEV_ORDER[y.impact] ?? 3));
  const b = d2n(baseDate());
  return `<div class="scroll-x"><table><tr><th>ID</th><th>${t('col.type')}</th><th>${t('col.category')}</th><th>${t('col.title')}</th><th>${t('col.impact')}</th><th>${t('col.owner')}</th><th>${t('col.due')}</th></tr>${sorted.slice(0, 6).map(r => `<tr><td>${esc(r.id)}</td><td>${lbl('raidType', r.type)}</td><td>${lbl('raidCat', r.category)}</td><td>${esc(r.title)}</td><td>${lvBadge(r.impact)}</td><td>${esc(r.owner)}</td><td class="${r.due && d2n(r.due) < b ? 'red' : ''}">${md(r.due)}</td></tr>`).join('')}</table></div>`;
}
function upcomingMeetings(list, b, sev){
  if (!list.length) return `<div class="empty">${t('empty.upcoming')}</div>`;
  return `<ul class="alert-list">${list.map(m => `<li><div class="date-chip">${md(m.date)}<small>${esc(m.time || '')}</small></div><div style="flex:1"><div class="t"><span class="link" data-open-mtg="${m.id}">${esc(m.title)}</span></div><div class="d">${t('mtg.agendaN', m.agenda.length)}${m.purpose ? '' : `　<span class="amber">${t('mtg.noPurpose')}</span>`}${m.agenda.length ? '' : `　<span class="red">${t('mtg.noAgenda')}</span>`}</div></div></li>`).join('')}</ul>`;
}
function actionMini(open, b){
  if (!open.length) return `<div class="empty">${t('empty.actions')}</div>`;
  const sorted = [...open].sort((x, y) => (x.due || '9') < (y.due || '9') ? -1 : 1);
  return `<div class="scroll-x"><table><tr><th>${t('col.action')}</th><th>${t('col.owner')}</th><th>${t('col.due')}</th><th>${t('col.meeting')}</th></tr>${sorted.slice(0, 6).map(a => `<tr><td>${esc(a.text)}</td><td>${esc(a.owner || '—')}</td><td class="${a.due && d2n(a.due) < b ? 'red' : ''}">${md(a.due)}</td><td class="muted">${md(a.meeting.date)} ${esc(a.meeting.title)}</td></tr>`).join('')}</table></div>`;
}
function gantt(b, sev){
  const ts = scopedTasks().filter(x => x.start && x.end && activeTask(x));
  if (!ts.length) return `<div class="empty">${t('empty.tasks')}</div>`;
  let min = Math.min(...ts.map(x => d2n(x.start)), b), max = Math.max(...ts.map(x => Math.max(d2n(x.end), d2n(x.baselineEnd) || 0)), b);
  min -= 3; max += 4;
  const L = 250, W = 1100, R = W - L - 12, rh = 22, top = 30, H = top + ts.length * rh + 6;
  const x = n => L + (n - min) / (max - min) * R;
  let g = '', lastPhase = null, band = false;
  ts.forEach((tk, i) => { if (tk.phaseId !== lastPhase) { band = !band; lastPhase = tk.phaseId; } if (band) g += `<rect x="0" y="${top + i * rh}" width="${W}" height="${rh}" class="g-band"/>`; });
  const d0 = new Date(min * 864e5);
  for (let y = d0.getUTCFullYear(), mo = d0.getUTCMonth() + 1; ; mo++) {
    const n = Date.UTC(y, mo, 1) / 864e5; if (n > max) break;
    g += `<line x1="${x(n)}" y1="${top - 8}" x2="${x(n)}" y2="${H}" class="g-grid"/><text x="${x(n) + 4}" y="${top - 12}" class="g-tick">${t('month', new Date(n * 864e5).getUTCMonth() + 1)}</text>`;
  }
  // 契約終了日
  const cEnds = (ui.scope ? [phaseOf(ui.scope)] : state.phases).filter(p => p && p.contractEnd);
  cEnds.forEach(p => { const cx = x(d2n(p.contractEnd) + 1); if (cx > L && cx < W) {
    const rows = ts.map((tk, i) => tk.phaseId === p.id ? i : -1).filter(i => i >= 0);
    if (rows.length) g += `<line x1="${cx}" x2="${cx}" y1="${top + rows[0] * rh}" y2="${top + (rows[rows.length - 1] + 1) * rh}" class="g-contract"><title>${esc(p.name)} ${t('ph.contractEndShort')} ${ymd(p.contractEnd)}</title></line>`;
  }});
  lastPhase = null;
  ts.forEach((tk, i) => {
    const y = top + i * rh, s = d2n(tk.start), e = d2n(tk.end), be = d2n(tk.baselineEnd), cy = y + rh / 2;
    const cls = isDone(tk) ? 'done' : (sev[tk.id] === 'L' ? '' : sev[tk.id] || '');
    const ph = phaseOf(tk.phaseId), phaseLbl = tk.phaseId !== lastPhase ? (ph ? ph.code + ' ' + ph.name : '') : ''; lastPhase = tk.phaseId;
    const nm = tk.name.length > 20 ? tk.name.slice(0, 19) + '…' : tk.name;
    g += `<text x="6" y="${cy + 4}" class="g-phase">${esc(phaseLbl.length > 9 ? phaseLbl.slice(0, 9) + '…' : phaseLbl)}</text><text x="78" y="${cy + 4}" class="g-label">${esc(nm)}</text>`;
    if (tk.milestone) {
      const cx = x(e + 0.5);
      g += `<path d="M${cx} ${cy - 7} L${cx + 7} ${cy} L${cx} ${cy + 7} L${cx - 7} ${cy} Z" class="g-ms ${cls}"><title>${esc(tk.name)} ${ymd(tk.end)}</title></path>`;
    } else {
      if (!isNaN(be) && be !== e) g += `<rect x="${x(s)}" y="${y + 4}" width="${Math.max(2, x(be + 1) - x(s))}" height="${rh - 8}" rx="3" class="g-base"/>`;
      const w = Math.max(2, x(e + 1) - x(s));
      g += `<rect x="${x(s)}" y="${y + 6}" width="${w}" height="${rh - 12}" rx="3" class="g-track"/>`;
      g += `<rect x="${x(s)}" y="${y + 6}" width="${w * Math.min(100, +tk.progress || 0) / 100}" height="${rh - 12}" rx="3" class="g-fill ${cls}"><title>${esc(tk.name)}：${ymd(tk.start)}〜${ymd(tk.end)} / ${tk.progress}%</title></rect>`;
      if (cls === 'H' || cls === 'M') g += `<rect x="${x(s)}" y="${y + 6}" width="${w}" height="${rh - 12}" rx="3" fill="none" stroke="var(--${cls === 'H' ? 'red' : 'amber'})" stroke-width="1.2"/>`;
    }
  });
  g += `<line x1="${x(b + 0.5)}" y1="${top - 4}" x2="${x(b + 0.5)}" y2="${H}" class="g-today"/><text x="${x(b + 0.5) + 4}" y="${top - 2}" class="g-todaylbl">${t('g.base')}</text>`;
  return `<div class="scroll-x"><svg viewBox="0 0 ${W} ${H}" style="min-width:760px;width:100%;display:block" role="img" aria-label="Gantt">${g}</svg></div>
    <div class="legend"><span><i style="background:var(--plan)"></i>${t('lg.plan')}</span><span><i style="border:1px dashed var(--muted)"></i>${t('lg.baseline')}</span><span><i style="background:var(--violet)"></i>${t('lg.contractEnd')}</span><span><i style="background:var(--red)"></i>${t('g.base')}</span></div>`;
}
function trendChart(m){
  const b = baseDate();
  const pts = snapshotsInScope().filter(s => s.date <= b).slice(-11).map(s => ({date: s.date, spi: s.spi}));

function mapHeader(h){
  const n = String(h).trim().toLowerCase().replace(/\s/g, '');
  for (const [k, al] of ALIASES) if (al.includes(n)) return k;
  for (const [k, al] of ALIASES) if (al.some(a => a.length > 1 && n.includes(a))) return k;

}
function parseCsv(text){
  text = text.replace(/^﻿/, '');
  const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === ',') { row.push(f); f = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(f); rows.push(row); row = []; f = ''; }
    else f += c;
  }
  if (f !== '' || row.length) { row.push(f); rows.push(row); }

}
function normDate(s){

  if (m) return `${m[1]}-${pad(m[2])}-${pad(m[3])}`;

const prioDot = p => `<span class="prio ${p || 'M'}" title="${t('tk.priority')}：${lbl('level', p || 'M')}"></span>`;
const PRIO_ORDER = {H: 0, M: 1, L: 2};

function newTask(extra){
  const bd = baseDate(), last = state.tasks.filter(x => x.phaseId).pop();
  const r = myRole(), ph = ui.scope || (r === 'lead' && leadPhases()[0]) || (last ? last.phaseId : (state.phases[0] || {}).id || '');
  const t0 = {id: nextId('T', state.tasks), phaseId: ph, name: t('tk.newName'), owner: r === 'member' ? myName() : (ui.owner || ''), start: bd, end: n2d(d2n(bd) + 6), baselineEnd: n2d(d2n(bd) + 6),
    progress: 0, status: 'todo', kind: 'general', priority: 'M', disp: '', milestone: false, updated: todayStr(), ...extra};
  state.tasks.push(t0); return t0;
}
function afterTaskChange(tk, f){
  if (f === 'kind') { // 種類を変えたら、同じ列（進み具合）のステータスに置き換える
    const lane = LANE_OF[tk.status] || 'todo', fl = flowOf(tk);
    tk.status = fl.find(s => LANE_OF[s] === lane) || fl[Math.min(fl.length - 2, KANBAN_LANES.indexOf(lane))] || 'todo';
    tk.progress = TASK_PCT[tk.status];
  }
  if (f === 'status') tk.progress = TASK_PCT[tk.status] ?? tk.progress;
  if (f === 'progress') {
    const v = Math.max(0, Math.min(100, parseInt(tk.progress) || 0)); tk.progress = v;
    if (v > 0 && tk.status === 'todo') tk.status = flowOf(tk)[1];

function moveTask(tk, status){
  if (!flowOf(tk).includes(status)) { toast(t('tk.noLane')); return false; }
  if (status === 'closed' && needsApproval(tk) && !canApprove(tk)) { toast(t('tk.needApprover')); return false; }

    if (cur && (cur.contract !== next.contract || (cur.contractRef || '') !== (next.contractRef || ''))) {

      if (confirm(t('tk.carryCr'))) state.crs.push({id: nextId('CR', state.crs), phaseId: next.id, title: t('tk.carryCrTitle', tk.name, next.name), requester: myName(), owner: state.project.pm || myName(), scope: t('tk.carryCrScope', cur.name, next.name), schedule: 0, cost: '', status: 'draft', raised: todayStr(), decided: '', note: ''});

    tk.phaseId = next.id; tk.disp = '';
    const ps = phaseRange(next).s, dur = Math.max(1, d2n(tk.end) - d2n(tk.start) + 1);
    if (ps && d2n(tk.start) < d2n(ps)) { tk.start = ps; tk.end = n2d(d2n(ps) + dur - 1); }
    tk.updated = todayStr();
    toast(t('tk.carried', tk.name, next.name));
  } else if (d === 'backlog') { tk.disp = 'backlog'; tk.updated = todayStr(); toast(t('tk.toBacklog', tk.name)); }
  else if (d === 'hold') {
    const why = prompt(t('tk.holdWhy'), tk.dispNote || ''); if (why === null) return;
    const until = prompt(t('tk.holdUntil'), tk.holdUntil || n2d(d2n(baseDate()) + 7)); if (until === null) return;
    tk.disp = 'hold'; tk.dispNote = why; tk.holdUntil = normDate(until) || ''; tk.updated = todayStr();
  } else if (d === 'dropped') {
    const why = prompt(t('tk.dropWhy')); if (!why) return;
    tk.disp = 'dropped'; tk.dispNote = why; tk.status = 'closed'; tk.updated = todayStr();
    state.raid.push({id: nextId('D', state.raid.filter(r => r.type === 'decision')), type: 'decision', phaseId: tk.phaseId, category: 'scope', title: t('tk.dropDecision', tk.name, why), owner: myName(), impact: '', prob: '', status: 'closed', raised: todayStr(), due: '', mitigation: ''});
    toast(t('tk.dropped', tk.name));
  } else if (d === 'resume') { tk.disp = ''; tk.updated = todayStr(); }
  save(); render();
}
function dispMenu(tk, i){
  if (!canDispose(tk) || tk.milestone) return tk.disp ? `<span class="disp ${tk.disp}">${t('disp.' + tk.disp)}</span>` : '';
  const opts = tk.disp ? [['resume', t('disp.resume')]] : [];
  if (!isDone(tk)) DISPS.forEach(d => { if (d !== tk.disp) opts.push([d, t('disp.do.' + d)]); });
  return `${tk.disp ? `<span class="disp ${tk.disp}" title="${esc(tk.dispNote || '')}${tk.holdUntil ? ' ～' + md(tk.holdUntil) : ''}">${t('disp.' + tk.disp)}</span>` : ''}
    ${opts.length ? `<select class="disp-sel" data-disp="${i}"><option value="">${t('disp.menu')}</option>${opts.map(([v, l]) => `<option value="${v}">${l}</option>`).join('')}</select>` : ''}`;
}
const carryBadge = tk => tk.carryCount ? `<span class="carry" title="${t('tk.carriedFrom', (tk.carriedFrom || []).map(id => phaseName(id)).join(' → '))}">↻${tk.carryCount}</span>` : '';

function renderTasks(v, ctx){
  const view = ui.taskView || 'kanban'; // 既定はカンバン（ドラッグでステータスを変える）
  const backlogN = state.tasks.filter(x => x.disp === 'backlog').length;
  const owners = [...new Set(state.tasks.map(x => x.owner).filter(Boolean))];
  v.innerHTML = `<div class="bar">
    <div class="seg">${['list','kanban','backlog'].map(k => `<button class="${view === k ? 'on' : ''}" data-tview="${k}">${t('tk.view.' + k)}${k === 'backlog' && backlogN ? ` <b>${backlogN}</b>` : ''}</button>`).join('')}</div>
    <select id="fOwner"><option value="">${t('flt.allOwners')}</option>${owners.map(o => `<option ${o === ui.owner ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select>
    ${view === 'list' ? `<label class="chk"><input type="checkbox" id="fAlert" ${ui.alertOnly ? 'checked' : ''}> ${t('flt.alertOnly')}</label>` : ''}
    <span class="sp"></span>
    <button class="btn primary" id="addTask">＋ ${t('tk.add')}</button>
    ${view === 'list' ? `<button class="btn" id="impCsv">${t('tk.import')}</button><button class="btn" id="tplCsv">${t('tk.template')}</button><button class="btn" id="expCsv">${t('tk.export')}</button><input type="file" id="csvFile" accept=".csv,text/csv" hidden>` : ''}
  </div><div id="taskBody"></div><aside class="org-drawer" id="taskDrawer"></aside>`;
  const body = $('#taskBody');
  if (view === 'kanban') renderKanban(body, ctx); else if (view === 'backlog') renderBacklog(body, ctx); else renderTaskList(body, ctx);
  drawTaskDrawer(v);
  v.querySelectorAll('[data-tview]').forEach(el => el.onclick = () => { ui.taskView = el.dataset.tview; ui.taskSel = ''; render(true); });
  $('#fOwner').onchange = e => { ui.owner = e.target.value; render(); };
  const fa = $('#fAlert'); if (fa) fa.onchange = e => { ui.alertOnly = e.target.checked; render(); };
  $('#addTask').onclick = () => { newTask(view === 'backlog' ? {disp: 'backlog', phaseId: ''} : {}); save(); render(); };
  if (view === 'list') {
    const head = () => TASK_COLS.map(([k]) => t('csv.' + k));
    $('#tplCsv').onclick = () => download(t('tk.templateFile'), '﻿' + toCsv([head(), ['T01', (state.phases[0] || {}).name || 'Phase', 'Task A', 'Owner', '2026/10/01', '2026/10/15', '2026/10/15', '50', lbl('taskStatus', 'doing'), '', '2026/10/10'], ['T02', (state.phases[0] || {}).name || 'Phase', 'Milestone', 'PM', '2026/10/31', '2026/10/31', '2026/10/31', '0', lbl('taskStatus', 'todo'), '○', '']]), 'text/csv');
    $('#expCsv').onclick = () => download(`WBS_${baseDate()}.csv`, '﻿' + toCsv([head(), ...state.tasks.map(tk => TASK_COLS.map(([k]) => k === 'milestone' ? (tk.milestone ? '○' : '') : k === 'phase' ? phaseName(tk.phaseId) : k === 'status' ? lbl('taskStatus', tk.status) : (['start','end','baselineEnd','updated'].includes(k) ? (tk[k] || '').replace(/-/g, '/') : tk[k])))]), 'text/csv');
    $('#impCsv').onclick = () => $('#csvFile').click();
    $('#csvFile').onchange = e => { const file = e.target.files[0]; if (file) importCsv(file); e.target.value = ''; };
  }
  v.querySelectorAll('[data-disp]').forEach(el => el.onchange = () => { const tk = state.tasks[+el.dataset.disp]; if (el.value) disposeTask(tk, el.value); });
  v.querySelectorAll('[data-approve]').forEach(el => el.onclick = e => { e.stopPropagation(); approveTask(state.tasks[+el.dataset.approve]); });
}

// ---- 一覧 ----
function renderTaskList(el, {b, alerts}){
  const alertBy = {}; alerts.forEach(a => { if (a.ref) (alertBy[a.ref] = alertBy[a.ref] || []).push(a); });
  const rows = state.tasks.map((tk, i) => ({tk, i})).filter(({tk}) => tk.disp !== 'backlog' && (!ui.scope || tk.phaseId === ui.scope) && (!ui.owner || tk.owner === ui.owner) && (!ui.alertOnly || alertBy[tk.id]))
    .sort((a, c) => phaseIdx(a.tk.phaseId) - phaseIdx(c.tk.phaseId) || a.i - c.i);
  const f = (i, k, o) => fld('tasks', i, k, state.tasks[i][k], o);
  el.innerHTML = `<div class="card">
    <div class="muted small" style="margin-bottom:8px">${t('tk.hint2')}</div>
    <div class="scroll-x"><table class="tasks">
      <tr><th>ID</th><th>${t('col.phase')}</th><th>${t('col.task')}</th><th>${t('tk.kind')}</th><th>${t('tk.priority')}</th><th>${t('col.owner')}</th><th>${t('col.start')}</th><th>${t('col.end')}</th><th>${t('col.baseline')}</th><th>${t('col.status')}</th><th class="num">${t('col.progress')}</th><th class="num">${t('col.planPct')}</th><th>${t('tk.disp')}</th><th>${t('col.alerts')}</th><th></th></tr>
      ${rows.map(({tk, i}) => `<tr class="${isDone(tk) ? 'closed' : ''} ${tk.disp === 'hold' ? 'held' : ''}">
        <td>${f(i, 'id', {cls: 'w-xs'})}</td>
        <td>${f(i, 'phaseId', {type: 'select', opts: phaseOpts(), blank: true})}</td>
        <td><div class="tname">${tk.milestone ? '<span class="ms">◆</span>' : ''}${f(i, 'name', {cls: 'w-name'})}${carryBadge(tk)}</div></td>
        <td>${tk.milestone ? '<span class="muted small">MS</span>' : f(i, 'kind', {type: 'select', opts: TASK_KINDS.map(k => [k, t('kind.' + k)])})}</td>
        <td><div class="tname">${prioDot(tk.priority)}${f(i, 'priority', {type: 'select', opts: prioOpts()})}</div></td>
        <td>${f(i, 'owner', {cls: 'w-s'})}</td>
        <td>${f(i, 'start', {type: 'date'})}</td><td>${f(i, 'end', {type: 'date'})}</td><td>${f(i, 'baselineEnd', {type: 'date'})}</td>
        <td><div class="tname">${f(i, 'status', {type: 'select', opts: flowOpts(tk), cls: 'st-sel st-' + LANE_OF[tk.status]})}${tk.status === 'approval' && canApprove(tk) ? `<button class="btn primary sm" data-approve="${i}">${t('tk.approve')}</button>` : ''}</div>${tk.approvedBy && tk.status === 'closed' ? `<div class="muted small">${t('tk.approvedBy', esc(tk.approvedBy), md(tk.approvedAt))}</div>` : ''}</td>
        <td>${f(i, 'progress', {type: 'number', cls: 'w-xs'})}</td>
        <td class="num muted">${plannedPct(tk, b)}</td>
        <td>${dispMenu(tk, i)}</td>
        <td>${(alertBy[tk.id] || []).map(a => `<span class="sev ${a.sev}" title="${esc(a.detail)}">${esc(t('at.' + a.type))}</span>`).join(' ')}</td>
        <td>${delBtn('tasks', i, tk.name)}</td>
      </tr>`).join('')}

    ${rows.length ? '' : `<div class="empty">${t('empty.tasks')}</div>`}
  </div>`;
}

// ---- カンバン（種類が違っても共通の 5 列に並べる。カードをドラッグして列を移す） ----
function renderKanban(el, {b, alerts}){
  const sev = sevMap(alerts);
  const list = state.tasks.map((tk, i) => ({tk, i})).filter(({tk}) => !tk.milestone && activeTask(tk) && (!ui.scope || tk.phaseId === ui.scope) && (!ui.owner || tk.owner === ui.owner));
  const byLane = Object.fromEntries(KANBAN_LANES.map(l => [l, []]));
  list.forEach(o => byLane[LANE_OF[o.tk.status] || 'todo'].push(o));
  Object.values(byLane).forEach(a => a.sort((x, y) => PRIO_ORDER[x.tk.priority] - PRIO_ORDER[y.tk.priority] || d2n(x.tk.end) - d2n(y.tk.end)));
  const closed = byLane.closed.sort((x, y) => (y.tk.updated || '') < (x.tk.updated || '') ? -1 : 1);
  const shownClosed = closed.slice(0, 8);
  const person = name => state.org.find(p => p.name === name);
  const card = ({tk, i}) => {
    const p = person(tk.owner), late = !isDone(tk) && d2n(tk.end) < b, fl = flowOf(tk), next = fl[fl.indexOf(tk.status) + 1];
    const canMove = can('tasks', i, 'status');
    const nextBtn = next && canMove ? (next === 'closed' && needsApproval(tk) ? (canApprove(tk) ? `<button class="btn primary sm" data-approve="${i}">${t('tk.approve')}</button>` : `<span class="muted small">${t('tk.waitApprove')}</span>`) : `<button class="btn sm" data-next="${i}">${lbl('taskStatus', next)} →</button>`) : '';
    return `<div class="kcard ${sev[tk.id] ? 'sev-' + sev[tk.id] : ''} ${tk.disp === 'hold' ? 'held' : ''}" draggable="${canMove}" data-kcard="${i}">
      <div class="kc-top">${prioDot(tk.priority)}<span class="tag k-${tk.kind}">${t('kind.' + tk.kind)}</span><span class="kc-st">${lbl('taskStatus', tk.status)}</span>${carryBadge(tk)}</div>
      <div class="kc-name">${esc(tk.name)}</div>
      ${tk.disp === 'hold' ? `<div class="kc-hold">⏸ ${esc(tk.dispNote || t('disp.hold'))}${tk.holdUntil ? ` ～${md(tk.holdUntil)}` : ''}</div>` : ''}
      <div class="kc-foot">${p ? `<span class="avatar xs" style="background:${orgColor(p.org)}">${esc(p.name.slice(0, 1))}</span>` : ''}<span class="small">${esc(tk.owner || '—')}</span><span class="sp"></span><span class="small ${late ? 'red' : 'muted'}">${md(tk.end)}</span></div>
      ${nextBtn ? `<div class="kc-act">${nextBtn}</div>` : ''}
    </div>`;
  };
  el.innerHTML = `<div class="kanban">${KANBAN_LANES.map(l => `<section class="klane" data-lane="${l}">
      <header><span class="kdot ${l}"></span>${t('lane.' + l)}<span class="kcount">${byLane[l].length}</span></header>
      <div class="klist">
        ${l === 'todo' && canCreate('tasks') ? `<input class="kquick" id="kQuick" placeholder="${t('tk.quickAdd')}">` : ''}
        ${(l === 'closed' ? shownClosed : byLane[l]).map(card).join('') || `<div class="kempty">${t('lane.empty')}</div>`}
        ${l === 'closed' && closed.length > shownClosed.length ? `<div class="muted small" style="text-align:center">${t('lane.more', closed.length - shownClosed.length)}</div>` : ''}
      </div></section>`).join('')}</div>
    <div class="muted small" style="margin-top:8px">${t('tk.kanbanHint')}</div>`;
  // ドラッグで列を移す
  el.querySelectorAll('[data-kcard]').forEach(c => {
    c.addEventListener('dragstart', e => { e.dataTransfer.setData('text/plain', c.dataset.kcard); c.classList.add('dragging'); });
    c.addEventListener('dragend', () => c.classList.remove('dragging'));
  });
  el.querySelectorAll('[data-lane]').forEach(lane => {
    lane.addEventListener('dragover', e => { e.preventDefault(); lane.classList.add('over'); });
    lane.addEventListener('dragleave', () => lane.classList.remove('over'));
    lane.addEventListener('drop', e => {
      e.preventDefault(); lane.classList.remove('over');
      const tk = state.tasks[+e.dataTransfer.getData('text/plain')]; if (!tk) return;
      const target = flowOf(tk).find(s => LANE_OF[s] === lane.dataset.lane);
      if (!target) { toast(t('tk.noLane')); return; }
      if (target === tk.status) return;
      if (moveTask(tk, target)) { save(); render(); }
    });
  });
  // カードをクリック → 右のパネルで編集（ボタン以外の場所）
  el.querySelectorAll('[data-kcard]').forEach(c => c.addEventListener('click', e => { if (e.target.closest('button, input, select, textarea')) return; ui.taskSel = c.dataset.kcard; render(); }));
  el.querySelectorAll('[data-next]').forEach(btn => btn.onclick = () => { const tk = state.tasks[+btn.dataset.next], fl = flowOf(tk); if (moveTask(tk, fl[fl.indexOf(tk.status) + 1])) { save(); render(); } });
  const q = $('#kQuick'); if (q) q.onkeydown = e => { if (e.key === 'Enter' && q.value.trim()) { newTask({name: q.value.trim()}); save(); render(); setTimeout(() => { const n = $('#kQuick'); if (n) n.focus(); }); } };
}

// ---- Backlog（時期未定。優先度順に並べ、決まったらフェーズに割り当てる） ----
function renderBacklog(el){
  const rows = state.tasks.map((tk, i) => ({tk, i})).filter(({tk}) => tk.disp === 'backlog' && (!ui.owner || tk.owner === ui.owner))
    .sort((a, c) => PRIO_ORDER[a.tk.priority] - PRIO_ORDER[c.tk.priority] || a.i - c.i);
  const f = (i, k, o) => fld('tasks', i, k, state.tasks[i][k], o);
  el.innerHTML = `<div class="card">
    <div class="bar"><h2 style="margin:0">${t('tk.view.backlog')}</h2><span class="hint">${t('tk.backlogHint')}</span></div>
    ${canCreate('tasks') ? `<input class="kquick" id="bQuick" placeholder="${t('tk.quickBacklog')}" style="margin-bottom:10px">` : ''}
    ${rows.length ? `<div class="scroll-x"><table>
      <tr><th>${t('tk.priority')}</th><th>${t('col.task')}</th><th>${t('tk.kind')}</th><th>${t('col.owner')}</th><th>${t('tk.from')}</th><th>${t('tk.assign')}</th><th></th></tr>
      ${rows.map(({tk, i}) => `<tr>
        <td><div class="tname">${prioDot(tk.priority)}${f(i, 'priority', {type: 'select', opts: prioOpts()})}</div></td>
        <td>${f(i, 'name', {cls: 'w-name'})}</td>
        <td>${f(i, 'kind', {type: 'select', opts: TASK_KINDS.map(k => [k, t('kind.' + k)])})}</td>
        <td>${f(i, 'owner', {cls: 'w-s'})}</td>
        <td class="muted small">${tk.phaseId ? esc(phaseName(tk.phaseId)) : '—'}</td>
        <td>${canDispose(tk) ? `<select data-assign="${i}"><option value="">${t('tk.assignPick')}</option>${state.phases.map(p => `<option value="${p.id}">${esc(p.code)} ${esc(p.name)}</option>`).join('')}</select>` : ''}</td>
        <td>${delBtn('tasks', i, tk.name)}</td></tr>`).join('')}
    </table></div>` : `<div class="empty">${t('tk.backlogEmpty')}</div>`}
  </div>`;
  el.querySelectorAll('[data-assign]').forEach(s => s.onchange = () => {
    const tk = state.tasks[+s.dataset.assign], ph = phaseOf(s.value); if (!ph) return;
    const st = d2n(phaseRange(ph).s) > d2n(baseDate()) ? phaseRange(ph).s : baseDate();
    tk.phaseId = ph.id; tk.disp = ''; tk.start = st; tk.end = n2d(d2n(st) + 6); tk.baselineEnd = tk.end; tk.updated = todayStr();
    save(); render(); toast(t('tk.assigned', tk.name, ph.name));
  });
  const q = $('#bQuick'); if (q) q.onkeydown = e => { if (e.key === 'Enter' && q.value.trim()) { newTask({name: q.value.trim(), disp: 'backlog', phaseId: ''}); save(); render(); setTimeout(() => { const n = $('#bQuick'); if (n) n.focus(); }); } };
}

// ---- タスクの編集パネル（カンバンのカードから開く。閉じるボタンは 1 つだけ） ----
function drawTaskDrawer(v){
  const d = v.querySelector('#taskDrawer'), i = ui.taskSel === '' || ui.taskSel == null ? -1 : +ui.taskSel, tk = state.tasks[i];
  if (!d) return;
  if (!tk) { d.classList.remove('open'); d.innerHTML = ''; return; }
  const f = (k, o) => fld('tasks', i, k, tk[k], o);
  d.innerHTML = `<div class="card">
    <div class="bar" style="margin-bottom:6px">${prioDot(tk.priority)}<h2 style="margin:0;flex:1">${esc(tk.name)}</h2><button class="btn ghost" id="taskClose" title="${t('org.close')}" aria-label="${t('org.close')}">✕</button></div>
    <div class="form-grid one">
      <label>${t('col.task')}${f('name', {type: 'textarea', rows: 2})}</label>
      <label>${t('col.status')}<div class="tname">${f('status', {type: 'select', opts: flowOpts(tk), cls: 'st-sel st-' + LANE_OF[tk.status]})}${tk.status === 'approval' && canApprove(tk) ? `<button class="btn primary sm" data-approve="${i}">${t('tk.approve')}</button>` : ''}</div>
        <small class="muted">${flowOf(tk).map(s => s === tk.status ? `<b>${lbl('taskStatus', s)}</b>` : lbl('taskStatus', s)).join(' → ')}</small></label>
      <label>${t('tk.kind')}${f('kind', {type: 'select', opts: TASK_KINDS.map(k => [k, t('kind.' + k)])})}</label>
      <label>${t('tk.priority')}${f('priority', {type: 'select', opts: prioOpts()})}</label>
      <label>${t('col.owner')}${f('owner')}</label>
      <label>${t('col.phase')}${f('phaseId', {type: 'select', opts: phaseOpts(), blank: true})}</label>
      <label>${t('col.start')}${f('start', {type: 'date'})}</label>
      <label>${t('col.end')}${f('end', {type: 'date'})}</label>
      <label>${t('col.progress')}${f('progress', {type: 'number'})}</label>
      <div class="lbl-block">${t('tk.disp')}<div>${dispMenu(tk, i)}</div>${tk.carryCount ? `<small class="muted">${t('tk.carriedFrom', (tk.carriedFrom || []).map(id => phaseName(id)).join(' → '))}</small>` : ''}</div>
      ${tk.approvedBy && tk.status === 'closed' ? `<div class="muted small">${t('tk.approvedBy', esc(tk.approvedBy), md(tk.approvedAt))}</div>` : ''}
    </div>
    ${canDelete('tasks', i) ? `<div class="bar" style="margin-top:14px"><span class="sp"></span><button class="btn danger" data-del="tasks" data-key="${i}" data-name="${esc(tk.name)}">${TRASH} ${t('btn.delete')}</button></div>` : ''}
  </div>`;
  d.classList.add('open');
  d.querySelector('#taskClose').onclick = () => { ui.taskSel = ''; render(); };
}

// ============ 会議管理 ============
function renderMeetings(v, {b, alerts}){
  const st = meetingStats(b);
  const pct = (a, n) => n ? Math.round(a / n * 100) + '%' : '—';
  const doneActs = st.acts.filter(a => a.status === 'done').length;
  let list = state.meetings.filter(inScope);
  if (ui.mtgFilter === 'upcoming') list = list.filter(m => d2n(m.date) >= b && m.status === 'planned');
  else if (ui.mtgFilter === 'past') list = list.filter(m => d2n(m.date) < b || m.status !== 'planned');
  list.sort((x, y) => (x.date + x.time < y.date + y.time ? -1 : 1) * (ui.mtgFilter === 'past' ? -1 : 1));
  const cur = state.meetings.find(m => m.id === ui.meetingId);
  const mAlerts = id => alerts.filter(a => a.ref === id && ['noAgenda','noPurpose','noMinutes','actionOverdue','actionIncomplete'].includes(a.type));
  v.innerHTML = `
  <div class="grid kpis">
    <div class="card kpi"><div class="lbl">${t('mk.upcoming', state.settings.lookahead)}</div><div class="val">${st.upcoming.length}</div></div>
    <div class="card kpi"><div class="lbl">${t('mk.agendaRate')}</div><div class="val ${st.withAgenda < st.upcoming.length ? 'amber' : 'green'}">${pct(st.withAgenda, st.upcoming.length)}</div><div class="note">${t('mk.agendaNote')}</div></div>
    <div class="card kpi"><div class="lbl">${t('mk.recordRate')}</div><div class="val ${st.recorded < st.past.length ? 'amber' : 'green'}">${pct(st.recorded, st.past.length)}</div><div class="note">${t('mk.recordNote')}</div></div>
    <div class="card kpi"><div class="lbl">${t('mk.actionRate')}</div><div class="val">${pct(doneActs, st.acts.length)}</div><div class="note ${st.overdue.length ? 'red' : ''}">${t('mk.overdueActs', st.overdue.length)}</div></div>
  </div>
  <div class="mtg-layout" style="margin-top:14px">
    <div class="card mtg-list">
      <div class="bar">
        <div class="seg">${['upcoming','past','all'].map(k => `<button class="${ui.mtgFilter === k ? 'on' : ''}" data-mf="${k}">${t('mf.' + k)}</button>`).join('')}</div>
        <span class="sp"></span>
      </div>

    const first = prompt(t('mtg.seriesFirst'), baseDate()); if (!normDate(first)) return;
    const interval = mt && /隔週|bi-?weekly/i.test(mt.cadence) ? 14 : mt && /月|month/i.test(mt.cadence) ? 28 : 7;
    for (let k = 0; k < Math.min(n, 52); k++) createMeeting(typeId, n2d(d2n(normDate(first)) + k * interval));
    save(); render(); toast(t('mtg.seriesDone', Math.min(n, 52)));
  };
  if (cur) bindMeetingEditor(cur);
}
function createMeeting(typeId, date){
  const mt = state.meetingTypes.find(x => x.id === typeId);
  const m = {id: nextId('M', state.meetings), typeId: typeId || '', title: mt ? mt.name : t('mtg.newName'), phaseId: ui.scope, date, time: '10:00', duration: mt ? +mt.duration || 60 : 60,
    location: '', organizer: state.project.pm || '', attendees: mt ? mt.attendees : '', purpose: mt ? mt.purpose : '',
    agenda: mt ? lines(mt.agenda).map(x => ({topic: x, owner: state.project.pm || '', minutes: Math.max(5, Math.round((+mt.duration || 60) / Math.max(1, lines(mt.agenda).length) / 5) * 5), ref: '', outcome: ''})) : [],
    status: 'planned', notes: '', decisions: [], actions: []};
  state.meetings.push(m);
  return m;
}
function meetingEditor(m, b){
  const f = (k, o) => fld('meetings', m.id, k, m[k], o);
  const total = m.agenda.reduce((s, a) => s + (+a.minutes || 0), 0);

  const past = d2n(m.date) <= b;
  const ag = (i, k, o) => fld('agenda', `${m.id}:${i}`, k, m.agenda[i][k], o);
  const dc = (i, k, o) => fld('decisions', `${m.id}:${i}`, k, m.decisions[i][k], o);
  const ac = (i, k, o) => fld('actions', `${m.id}:${i}`, k, m.actions[i][k], o);
  return `<div class="card">
    <div class="bar" style="margin-bottom:6px"><h2 style="margin:0">${esc(m.title)}</h2><span class="st ${m.status}">${lbl('mtgStatus', m.status)}</span><span class="sp"></span>
      <button class="btn" id="copyAgenda">${t('mtg.copyAgenda')}</button>
      <button class="btn" id="copyMinutes">${t('mtg.copyMinutes')}</button>
      ${delBtn('meetings', m.id, m.title)}</div>
    <div class="steps"><span class="${m.purpose && m.agenda.length ? 'ok' : ''}">① ${t('mtg.step1')}</span><span class="${m.status === 'done' ? 'ok' : ''}">② ${t('mtg.step2')}</span><span class="${m.actions.length && m.actions.every(a => a.status === 'done') ? 'ok' : ''}">③ ${t('mtg.step3')}</span></div>

    <h3>${t('mtg.secPlan')}</h3>
    <div class="form-grid">
      <label>${t('mtg.title')}${f('title')}</label>
      <label>${t('mtg.type')}${f('typeId', {type:'select', opts: state.meetingTypes.map(x => [x.id, x.name]), blank: t('mtg.custom')})}</label>
      <label>${t('col.phase')}${f('phaseId', {type:'select', opts: phaseOpts(), blank: t('common.common')})}</label>
      <label>${t('mtg.date')}${f('date', {type:'date'})}</label>
      <label>${t('mtg.time')}${f('time', {type:'time'})}</label>
      <label>${t('mtg.duration')}${f('duration', {type:'number'})}</label>
      <label>${t('mtg.location')}${f('location')}</label>
      <label>${t('mtg.organizer')}${f('organizer')}</label>
      <label>${t('mtg.attendees')}${f('attendees')}</label>
    </div>
    <label class="lbl-block" style="margin-top:10px">${t('mtg.purpose')} <span class="req">${t('mtg.required')}</span>${f('purpose', {type:'textarea', rows:2, ph: t('mtg.purposePh')})}</label>

    <h3>${t('mtg.secAgenda')} <span class="hint ${over ? 'red' : ''}">${t('mtg.timebox', total, m.duration || 0)}${over ? ' ⚠ ' + t('mtg.overTime') : ''}</span></h3>
    <div class="scroll-x"><table>
      <tr><th>#</th><th>${t('mtg.topic')}</th><th>${t('col.owner')}</th><th class="num">${t('mtg.min')}</th><th>${t('mtg.ref')}</th><th>${t('mtg.outcome')}</th><th></th></tr>
      ${m.agenda.map((a, i) => `<tr><td class="muted">${i + 1}</td><td>${ag(i, 'topic', {cls:'w-name'})}</td><td class="${a.owner ? '' : 'cell-late'}">${ag(i, 'owner', {cls:'w-s', ph: t('mtg.ownerReq')})}</td><td>${ag(i, 'minutes', {type:'number', cls:'w-xs'})}</td><td>${ag(i, 'ref', {cls:'w-s', ph:'T07 / R01'})}</td><td>${ag(i, 'outcome', {cls:'w-name', ph: past ? t('mtg.outcomePh') : ''})}</td><td>${delBtn('agenda', `${m.id}:${i}`)}</td></tr>`).join('')}
    </table></div>
    <div class="bar" style="margin-top:6px"><button class="btn" id="addAgenda">＋ ${t('mtg.addAgenda')}</button>
      ${m.typeId ? `<button class="btn ghost" id="loadStd">${t('mtg.loadStd')}</button>` : ''}
      <select id="pullRef"><option value="">${t('mtg.pull')}</option>${pullCandidates(m).map(([v, l]) => `<option value="${esc(v)}">${esc(l)}</option>`).join('')}</select></div>

    <h3>${t('mtg.secResult')}</h3>
    <div class="form-grid"><label>${t('col.status')}${f('status', {type:'select', opts: enumOpts('mtgStatus')})}</label></div>
    <label class="lbl-block" style="margin-top:8px">${t('mtg.decisions')}</label>
    <div class="scroll-x"><table>${m.decisions.map((d, i) => `<tr><td class="muted" style="width:24px">${i + 1}</td><td>${dc(i, 'text', {cls:'w-name'})}</td><td style="width:30px">${delBtn('decisions', `${m.id}:${i}`)}</td></tr>`).join('')}</table></div>

      ${m.actions.map((a, i) => `<tr><td>${ac(i, 'text', {cls:'w-name'})}</td><td class="${a.owner ? '' : 'cell-late'}">${ac(i, 'owner', {cls:'w-s'})}</td><td class="${!a.due || (a.status !== 'done' && d2n(a.due) < b) ? 'cell-late' : ''}">${ac(i, 'due', {type:'date'})}</td><td>${ac(i, 'status', {type:'select', opts: enumOpts('actStatus')})}</td><td>${delBtn('actions', `${m.id}:${i}`)}</td></tr>`).join('')}

  </div>`;

// 前回会議の未完了アクション・オープン課題などをアジェンダに取り込む候補
function pullCandidates(m){
  const out = [];
  const prev = state.meetings.filter(x => x.id !== m.id && x.typeId === m.typeId && x.date < m.date).sort((a, b) => a.date < b.date ? -1 : 1).pop();
  if (prev) prev.actions.filter(a => a.status !== 'done').forEach((a, i) => out.push([`act:${prev.id}:${prev.actions.indexOf(a)}`, `${t('mtg.prevAction')}: ${a.text}`]));
  state.raid.filter(r => r.status !== 'closed' && r.type !== 'decision' && (!m.phaseId || !r.phaseId || r.phaseId === m.phaseId)).forEach(r => out.push([`raid:${r.id}`, `${r.id} ${r.title}`]));
  state.crs.filter(c => ['analysis','pending'].includes(c.status)).forEach(c => out.push([`cr:${c.id}`, `${c.id} ${c.title}`]));
  return out;
}
function bindMeetingEditor(m){
  const push = (arr, o) => { arr.push(o); save(); render(); };
  $('#addAgenda').onclick = () => push(m.agenda, {topic: '', owner: '', minutes: 10, ref: '', outcome: ''});
  $('#addDecision').onclick = () => push(m.decisions, {text: ''});
  $('#addAction').onclick = () => push(m.actions, {id: 'A' + (m.actions.length + 1), text: '', owner: '', due: n2d(d2n(m.date) + 7), status: 'open'});
  const ls = $('#loadStd'); if (ls) ls.onclick = () => { const mt = state.meetingTypes.find(x => x.id === m.typeId); if (!mt) return; lines(mt.agenda).forEach(x => m.agenda.push({topic: x, owner: m.organizer || '', minutes: 10, ref: '', outcome: ''})); save(); render(); };
  $('#pullRef').onchange = e => {
    const [kind, a, c] = e.target.value.split(':'); if (!kind) return;
    if (kind === 'act') { const pm = state.meetings.find(x => x.id === a), act = pm.actions[+c]; m.agenda.push({topic: `${t('mtg.prevAction')}: ${act.text}`, owner: act.owner, minutes: 5, ref: '', outcome: ''}); }
    else if (kind === 'raid') { const r = state.raid.find(x => x.id === a); m.agenda.push({topic: r.title, owner: r.owner, minutes: 10, ref: r.id, outcome: ''}); }
    else if (kind === 'cr') { const cr = state.crs.find(x => x.id === a); m.agenda.push({topic: `${cr.id} ${cr.title}`, owner: cr.owner, minutes: 10, ref: cr.id, outcome: ''}); }
    save(); render();
  };
  const doneBtn = $('#markDone'); if (doneBtn) doneBtn.onclick = () => {
    const miss = [];
    if (m.agenda.some(a => !String(a.outcome || '').trim())) miss.push(t('mtg.missOutcome'));
    if (m.actions.some(a => !a.owner || !a.due)) miss.push(t('mtg.missAction'));
    if (miss.length && !confirm(t('mtg.confirmDone', miss.join('\n')))) return;
    m.status = 'done'; save(); render(); toast(t('mtg.doneToast'));
  };
  const tr = $('#toRaid'); if (tr) tr.onclick = () => {
    let n = 0;
    m.decisions.filter(d => String(d.text || '').trim() && !d.logged).forEach(d => {
      state.raid.push({id: nextId('D', state.raid.filter(r => r.type === 'decision')), type: 'decision', phaseId: m.phaseId, category: 'other', title: d.text, owner: m.organizer, impact: '', prob: '', status: 'closed', raised: m.date, due: '', mitigation: `${t('col.meeting')}: ${m.title} (${ymd(m.date)})`});
      d.logged = true; n++;
    });
    save(); render(); toast(t('mtg.toRaidDone', n));
  };
  $('#copyAgenda').onclick = () => copyText(agendaMd(m));
  $('#copyMinutes').onclick = () => copyText(minutesMd(m));
}
function actionTable(acts, b){
  if (!acts.length) return `<div class="empty">${t('empty.actions')}</div>`;
  const sorted = [...acts].sort((x, y) => (x.status === 'done') - (y.status === 'done') || ((x.due || '9') < (y.due || '9') ? -1 : 1));
  return `<div class="scroll-x"><table><tr><th>${t('col.action')}</th><th>${t('col.owner')}</th><th>${t('col.due')}</th><th>${t('col.status')}</th><th>${t('col.meeting')}</th></tr>
    ${sorted.map(a => { const i = a.meeting.actions.findIndex(x => x.id === a.id && x.text === a.text); const late = a.status !== 'done' && a.due && d2n(a.due) < b;
      return `<tr class="${a.status === 'done' ? 'muted' : ''}"><td>${esc(a.text)}</td><td>${esc(a.owner || '—')}</td><td class="${late ? 'red' : ''}">${md(a.due)}${late ? ` (+${b - d2n(a.due)})` : ''}</td><td>${fld('actions', `${a.meeting.id}:${i}`, 'status', a.status, {type:'select', opts: enumOpts('actStatus')})}</td><td><span class="link" data-open-mtg="${a.meeting.id}">${md(a.meeting.date)} ${esc(a.meeting.title)}</span></td></tr>`; }).join('')}
  </table></div>`;
}
const timeRange = m => { if (!m.time) return ''; const [h, mi] = m.time.split(':').map(Number), e = h * 60 + mi + (+m.duration || 0); return `${m.time}–${pad(Math.floor(e / 60) % 24)}:${pad(e % 60)}`; };
function agendaMd(m){
  const L = [`# ${m.title}`, `- ${t('mtg.date')}: ${ymd(m.date)} ${timeRange(m)}（${m.duration || 0}${t('mtg.minUnit')}）`, `- ${t('mtg.location')}: ${m.location || '—'}`, `- ${t('mtg.attendees')}: ${m.attendees || '—'}`, `- ${t('mtg.purpose')}: ${m.purpose || '—'}`, '', `## ${t('mtg.secAgenda')}`, `| # | ${t('mtg.topic')} | ${t('col.owner')} | ${t('mtg.min')} | ${t('mtg.ref')} |`, '|---|---|---|---|---|'];
  m.agenda.forEach((a, i) => L.push(`| ${i + 1} | ${cell(a.topic)} | ${cell(a.owner)} | ${a.minutes || ''} | ${cell(a.ref)} |`));
  L.push('', t('mtg.agendaFooter'));
  return L.join('\n');
}
function minutesMd(m){
  const L = [`# ${t('mtg.minutesTitle')}: ${m.title}（${ymd(m.date)}）`, `- ${t('mtg.date')}: ${ymd(m.date)} ${timeRange(m)}`, `- ${t('mtg.attendees')}: ${m.attendees || '—'}`, `- ${t('mtg.purpose')}: ${m.purpose || '—'}`, '', `## ${t('mtg.secAgenda')} / ${t('mtg.outcome')}`, `| # | ${t('mtg.topic')} | ${t('col.owner')} | ${t('mtg.outcome')} |`, '|---|---|---|---|'];
  m.agenda.forEach((a, i) => L.push(`| ${i + 1} | ${cell(a.topic)} | ${cell(a.owner)} | ${cell(a.outcome || '—')} |`));
  L.push('', `## ${t('mtg.decisions')}`);
  if (m.decisions.length) m.decisions.forEach(d => L.push(`- ${d.text}`)); else L.push(t('common.none'));
  L.push('', `## ${t('mtg.actions')}`, `| # | ${t('col.action')} | ${t('col.owner')} | ${t('col.due')} |`, '|---|---|---|---|');
  m.actions.forEach((a, i) => L.push(`| ${i + 1} | ${cell(a.text)} | ${cell(a.owner)} | ${ymd(a.due)} |`));
  if (m.notes) L.push('', `## ${t('mtg.notes')}`, ...lines(m.notes).map(x => `- ${x}`));
  return L.join('\n');
}

const GOV_SECTIONS = ['rules','naming','bodies','cr'];

function govRules(body, b, ps){

    </details>`; }).join('')}</div>`;

}

// ============ 週次レポート（日英どちらでも出力） ============
function buildReport(lang){
  const L_ = (k, ...a) => tl(lang, k, ...a), lb = (g, v) => lbl(g, v, lang);
  const b = d2n(baseDate()), alerts = computeAlerts(lang).filter(scopeAlert), tasks = scopedTasks(), m = metrics(tasks, b), rag = computeRag(m, alerts);
  const P = state.project, S = state.settings, prev = prevSnapshot(), ph = ui.scope ? phaseOf(ui.scope) : null;
  const cnt = s => alerts.filter(a => a.sev === s).length;
  const sevTxt = s => (s === 'H' ? '🔴 ' : s === 'M' ? '🟡 ' : '') + lb('level', s);
  const L = [];
  let n = 0; const H2 = k => { n++; L.push('', `## ${n}. ${L_(k)}`); };
  L.push(`# ${L_('rp.title')}：${P.name}${ph ? `（${ph.code} ${ph.name}）` : ''}`);
  L.push(`- ${L_('rp.asOf')}：${ymd(baseDate())}（${L_('rp.period')} ${ymd(n2d(b - 6))}〜${ymd(baseDate())}）`);
  L.push(`- ${L_('rp.client')}：${P.client || '—'}　／　PM：${P.pm || '—'}　／　${L_('rp.pjPeriod')}：${ymd(P.start)}〜${ymd(P.end)}`);
  H2('rp.s.status'); L[L.length - 1] += `：${RAG_EMOJI[rag]} ${L_('rag.' + rag)}`;
  L.push(`| ${L_('rp.metric')} | ${L_('rp.value')} |`, '|---|---|');
  L.push(`| ${L_('kpi.progress')} | ${m.actual}% / ${m.planned}%（${L_('kpi.variance', (m.actual - m.planned > 0 ? '+' : '') + (m.actual - m.planned))}） |`);
  L.push(`| SPI | ${m.spi.toFixed(2)}${prev ? `（${L_('rp.prev')} ${prev.spi.toFixed(2)} ${m.spi < prev.spi ? '↓' : m.spi > prev.spi ? '↑' : '→'}）` : ''} |`);
  L.push(`| ${L_('rp.overdueTasks')} | ${alerts.filter(a => a.type === 'overdue').length} |`);
  L.push(`| ${L_('kpi.alerts')} | ${cnt('H')} / ${cnt('M')} / ${cnt('L')} |`);
  const openRaid = state.raid.filter(r => inScope(r) && r.status !== 'closed' && r.type !== 'decision');
  L.push(`| ${L_('kpi.raid')} | ${openRaid.filter(r => r.type === 'risk' || r.type === 'issue').length}（${L_('raidCat.contract')} ${openRaid.filter(r => r.category === 'contract').length}） |`);
  const gs = govStats(); if (!ph) L.push(`| ${L_('kpi.gov')} | ${gs.agreed} / ${gs.total} |`);

  H2('rp.s.summary');
  const sm = [];
  sm.push(L_('rp.sum1', m.planned, m.actual, m.spi.toFixed(2), m.spi >= S.spiAmber ? L_('rp.onTrack') : m.spi >= S.spiRed ? `**${L_('rp.slightlyBehind')}**` : `**${L_('rp.wellBehind')}**`));
  if (prev) sm.push(L_('rp.sum2', md(prev.date), prev.spi.toFixed(2), m.spi < prev.spi ? `**${L_('rp.worse')}**` : m.spi > prev.spi ? L_('rp.better') : L_('rp.flat')));
  if (!ph) {
    const worst = state.phases.map(p => ({p, m: metrics(tasksOf(p.id), b)})).filter(x => tasksOf(x.p.id).some(t => !isDone(t))).map(x => ({...x, gap: x.m.planned - x.m.actual})).sort((x, y) => y.gap - x.gap)[0];
    if (worst && worst.gap >= 10) sm.push(L_('rp.sum3', worst.p.name, worst.m.planned, worst.m.actual, worst.gap));
  }
  const ms = tasks.filter(t => t.milestone && !isDone(t) && d2n(t.end) >= b).sort((x, y) => d2n(x.end) - d2n(y.end))[0];
  if (ms) { const risk = alerts.find(a => a.ref === ms.id && a.type === 'msRisk'); sm.push(L_('rp.sum4', ms.name, ymd(ms.end), d2n(ms.end) - b, risk ? `**${L_('rp.msAtRisk')}**` : L_('rp.msOk'))); }
  const contract = alerts.filter(a => a.type === 'contractOverrun');
  if (contract.length) sm.push(`**${L_('rp.sumContract', contract.map(a => a.target).join(', '))}**`);
  if (cnt('H')) sm.push(L_('rp.sum5', cnt('H')));
  const scopeT = state.tasks.filter(x => !ui.scope || x.phaseId === ui.scope || (x.carriedFrom || []).includes(ui.scope));
  const carried = scopeT.filter(x => x.carryCount && !isDone(x)).length, onHold = scopeT.filter(x => x.disp === 'hold').length, backlog = state.tasks.filter(x => x.disp === 'backlog').length, wait = scopeT.filter(x => x.status === 'approval' && activeTask(x)).length;
  if (carried || onHold || backlog || wait) sm.push(L_('rp.sumDisp', carried, onHold, backlog, wait));
  sm.forEach(s => L.push(`- ${s}`));
  const topics = lines(state.report.topics);
  if (topics.length) { L.push('', `**${L_('rp.topics')}**`); topics.forEach(x => L.push(`- ${x.replace(/^[-・*]\s*/, '')}`)); }

  if (ph) {
    H2('rp.s.phase');
    const {s, e} = phaseRange(ph);
    L.push(`| ${L_('rp.metric')} | ${L_('rp.value')} |`, '|---|---|');
    L.push(`| ${L_('ph.period')} | ${ymd(s)}〜${ymd(e)} |`, `| ${L_('ph.contractType')} | ${lb('contract', ph.contract)} |`, `| ${L_('ph.contractRef')} | ${cell(ph.contractRef || '—')} |`, `| ${L_('ph.contractEnd')} | ${ymd(ph.contractEnd)} |`, `| ${L_('ph.gate')} | ${lb('gate', ph.gate)} |`);
    L.push(`| ${L_('ph.deliverables')} | ${cell(lines(ph.deliverables).join(' / ') || '—')} |`, `| ${L_('ph.exitCriteria')} | ${cell(lines(ph.exitCriteria).join(' / ') || '—')} |`);
    L.push('', `| ${L_('col.task')} | ${L_('col.owner')} | ${L_('col.end')} | ${L_('lg.plan')} | ${L_('lg.actual')} | ${L_('col.status')} |`, '|---|---|---|---|---|---|');
    tasks.forEach(t => L.push(`| ${t.milestone ? '◆ ' : ''}${cell(t.name)} | ${cell(t.owner)} | ${md(t.end)} | ${plannedPct(t, b)}% | ${t.progress}% | ${lb('taskStatus', t.status)} |`));
  } else {
    H2('rp.s.phases');
    L.push(`| ${L_('col.phase')} | ${L_('ph.period')} | ${L_('ph.contractType')} | ${L_('lg.plan')} | ${L_('lg.actual')} | ${L_('rp.diff')} | ${L_('ph.gate')} | ${L_('rp.state')} |`, '|---|---|---|---|---|---|---|---|');
    state.phases.forEach(p => { const ts = tasksOf(p.id), pm = metrics(ts, b), {s, e} = phaseRange(p), gap = pm.actual - pm.planned;
      const st = ts.length && ts.every(isDone) ? L_('rp.st.done') : pm.planned === 0 ? L_('rp.st.notStarted') : gap <= -20 ? '🔴 ' + L_('rp.st.late') : gap <= -10 ? '🟡 ' + L_('rp.st.watch') : '🟢 ' + L_('rp.st.ok');
      L.push(`| ${cell(p.code + ' ' + p.name)} | ${md(s)}〜${md(e)} | ${lb('contract', p.contract)} | ${pm.planned}% | ${pm.actual}% | ${gap > 0 ? '+' : ''}${gap}pt | ${lb('gate', p.gate)} | ${st} |`); });
  }

  H2('rp.s.alerts');
  const main = alerts.filter(a => a.sev !== 'L');
  if (main.length) {
    L.push(`| ${L_('col.sev')} | ${L_('col.alertType')} | ${L_('col.target')} | ${L_('col.owner')} | ${L_('col.detail')} |`, '|---|---|---|---|---|');
    main.slice(0, 15).forEach(a => L.push(`| ${sevTxt(a.sev)} | ${L_('at.' + a.type)} | ${cell(a.target)} | ${cell(a.owner)} | ${cell(a.detail)} |`));
    const low = alerts.length - main.length; if (low) L.push('', L_('rp.lowMore', low));
  } else L.push(L_('empty.alerts'));

  H2('rp.s.raid');
  const raidSorted = openRaid.sort((x, y) => (x.category === 'contract' ? -1 : 0) - (y.category === 'contract' ? -1 : 0) || (SEV_ORDER[x.impact] ?? 3) - (SEV_ORDER[y.impact] ?? 3));
  if (raidSorted.length) {
    L.push(`| ID | ${L_('col.type')} | ${L_('col.phase')} | ${L_('col.category')} | ${L_('col.title')} | ${L_('col.impact')} | ${L_('col.owner')} | ${L_('col.due')} | ${L_('col.mitigation')} |`, '|---|---|---|---|---|---|---|---|---|');
    raidSorted.slice(0, 12).forEach(r => L.push(`| ${cell(r.id)} | ${lb('raidType', r.type)} | ${cell(r.phaseId ? phaseName(r.phaseId, lang) : L_('common.common'))} | ${lb('raidCat', r.category)} | ${cell(r.title)} | ${lb('level', r.impact)} | ${cell(r.owner)} | ${md(r.due)}${r.due && d2n(r.due) < b ? ' ⚠' : ''} | ${cell(r.mitigation || L_('rp.notFilled'))} |`));
  } else L.push(L_('empty.raid'));

  H2('rp.s.cr');
  const crs = state.crs.filter(c => inScope(c) && !['done','rejected'].includes(c.status) || (inScope(c) && c.decided && d2n(c.decided) > b - 7));
  if (crs.length) {
    L.push(`| ID | ${L_('col.title')} | ${L_('cr.scope')} | ${L_('cr.schedule')} | ${L_('cr.cost')} | ${L_('col.status')} | ${L_('col.raised')} |`, '|---|---|---|---|---|---|---|');
    crs.forEach(c => L.push(`| ${cell(c.id)} | ${cell(c.title)} | ${cell(c.scope)} | ${c.schedule || 0} | ${cell(c.cost)} | ${lb('crStatus', c.status)} | ${md(c.raised)} |`));
  } else L.push(L_('empty.crs'));

  H2('rp.s.meetings');
  const held = state.meetings.filter(x => inScope(x) && x.status === 'done' && d2n(x.date) > b - 7 && d2n(x.date) <= b);
  if (held.length) held.forEach(x => { L.push(`**${md(x.date)} ${x.title}**`); x.decisions.forEach(d => L.push(`- ${L_('rp.decision')}：${d.text}`)); if (!x.decisions.length) L.push(`- ${L_('rp.noDecision')}`); });
  else L.push(L_('rp.noMeetings'));
  const open = state.meetings.filter(x => inScope(x) && x.status !== 'cancelled').flatMap(x => x.actions.filter(a => a.status !== 'done').map(a => ({...a, mt: x}))).sort((x, y) => (x.due || '9') < (y.due || '9') ? -1 : 1);
  if (open.length) {
    L.push('', `**${L_('rp.openActions')}**`, '', `| ${L_('col.action')} | ${L_('col.owner')} | ${L_('col.due')} | ${L_('col.meeting')} |`, '|---|---|---|---|');
    open.slice(0, 12).forEach(a => L.push(`| ${cell(a.text)} | ${cell(a.owner || '—')} | ${md(a.due)}${a.due && d2n(a.due) < b ? ' ⚠' : ''} | ${cell(md(a.mt.date) + ' ' + a.mt.title)} |`));
  }

  H2('rp.s.upcoming'); L[L.length - 1] = L[L.length - 1].replace('{0}', S.lookahead);
  const up = tasks.filter(t => !isDone(t) && ((d2n(t.start) > b && d2n(t.start) <= b + S.lookahead) || (d2n(t.end) >= b && d2n(t.end) <= b + S.lookahead))).map(t => ({d: d2n(t.start) > b ? t.start : t.end, k: t.milestone ? '◆ MS' : d2n(t.start) > b ? L_('rp.startPlan') : L_('rp.endPlan'), name: t.name, owner: t.owner}));
  state.meetings.filter(x => inScope(x) && x.status === 'planned' && d2n(x.date) >= b && d2n(x.date) <= b + S.lookahead).forEach(x => up.push({d: x.date, k: L_('col.meeting'), name: x.title, owner: x.organizer}));
  if (up.length) { L.push(`| ${L_('rp.date')} | ${L_('rp.kind')} | ${L_('rp.item')} | ${L_('col.owner')} |`, '|---|---|---|---|'); up.sort((x, y) => x.d < y.d ? -1 : 1).forEach(u => L.push(`| ${md(u.d)} | ${u.k} | ${cell(u.name)} | ${cell(u.owner)} |`)); }
  else L.push(L_('rp.noUpcoming'));

  H2('rp.s.requests');
  const req = lines(state.report.requests);
  if (req.length) req.forEach(x => L.push(`- ${x.replace(/^[-・*]\s*/, '')}`));
  else {
    const auto = alerts.filter(a => a.sev === 'H' && ['noMitigation','msRisk','raidOverdue','contractOverrun','gateOverdue'].includes(a.type));
    const crWait = state.crs.filter(c => inScope(c) && c.status === 'pending');
    if (auto.length || crWait.length) { L.push(L_('rp.autoReq')); auto.forEach(a => L.push(`- ${a.target}：${a.detail}`)); crWait.forEach(c => L.push(`- ${L_('rp.crDecision', c.id, c.title)}`)); }
    else L.push(L_('common.none'));
  }
  return L.join('\n');
}
function renderReport(v, ctx){

      <label class="lbl-block">${t('rp.topicsF')}${fld('report', 0, 'topics', state.report.topics, {type:'textarea', rows:3, ph: t('rp.topicsPh')})}</label>
      <label class="lbl-block">${t('rp.requestsF')}${fld('report', 0, 'requests', state.report.requests, {type:'textarea', rows:3, ph: t('rp.requestsPh')})}</label>

function dgPath(e, a, b){

  if (e.style === 'rail') return `M${ax + 14} ${ay + a.h}V${by + b.h / 2}H${bx}`;
  if (e.kind === 'report') { const x1 = ax + a.w / 2, y1 = ay + a.h, x2 = bx + b.w / 2, y2 = by - 3, dy = Math.max(18, (y2 - y1) / 2); return `M${x1} ${y1}C${x1} ${y1 + dy},${x2} ${y2 - dy},${x2} ${y2}`; }

  }

  const x1 = ax + a.w, y1 = ay + a.h / 2, x2 = bx - 3, y2 = by + b.h / 2;

    svg.setPointerCapture(e.pointerId); svg.classList.add('connecting');

      drag.g.setAttribute('transform', `translate(${n.x},${n.y})`); drawAll(drag.id);

    }

    const d = drag; drag = null; d.g.classList.remove('dragging');

}
// 辺の小さなメニュー（ラベル変更・削除）
function dgPopover(x, y, html, bind){
  document.querySelectorAll('.dg-pop').forEach(p => p.remove());
  const m = document.createElement('div'); m.className = 'dg-pop'; m.style.left = Math.min(x, innerWidth - 260) + 'px'; m.style.top = Math.min(y + 8, innerHeight - 140) + 'px';
  m.innerHTML = html; document.body.appendChild(m);

}

// 縦＝階層（報告ラインの深さ）、横＝所属（顧客／自社／ベンダー）の列。
// 人ごとの「抱えているもの」（タスク・アクション・RAID・警戒）を名前で突き合わせて表示する
function personLoad(name, b, alerts){
  if (!name) return {tasks: [], acts: [], raid: [], high: 0};
  const tasks = state.tasks.filter(x => x.owner === name && !isDone(x) && activeTask(x) && x.disp !== 'hold' && !x.milestone && d2n(x.start) <= b + state.settings.lookahead);
  const acts = state.meetings.filter(m => m.status !== 'cancelled').flatMap(m => m.actions.filter(a => a.owner === name && a.status !== 'done').map(a => ({...a, meeting: m})));
  const raid = state.raid.filter(r => r.owner === name && r.status !== 'closed' && r.type !== 'decision');

const ORG_LANES = ['client','us','vendor','other'];
const orgColor = o => ({client: 'var(--green)', us: 'var(--accent)', vendor: 'var(--amber)'}[o] || 'var(--muted)');

  const byId = Object.fromEntries(people.map(p => [p.id, p])), memo = {};

    if (memo[p.id] != null) return memo[p.id];
    const par = byId[p.parentId];

    seen.add(p.id); return (memo[p.id] = d(par, seen) + 1);

// 組織図（全体・顧客・自社・カスタム）を描く。people に含まれる人だけを対象にする。
// layout：tree（木構造・既定）／lanes（所属の列）。どちらでも編集モードでノードと線を編集できる
function orgGraphView(v, {b, alerts}, people, caption, viewKey){
  const mode = ui.orgLayout || 'tree', edit = !!ui.diagEdit && canCreate('org');
  const avail = Math.max(600, (v.clientWidth || 1000) - 40);
  const auto = mode === 'lanes' ? orgGraph(avail, people) : orgTree(people);
  const NW = auto.NW, NH = auto.NH, key = `${viewKey || 'all'}:${mode}`;
  state.layouts = state.layouts || {};
  const over = state.layouts[key] || {};
  const P = id => over[id] || auto.pos[id];
  const inSet = new Set(people.map(p => p.id));
  const inPhase = ui.scope ? new Set(state.tasks.filter(x => x.phaseId === ui.scope).map(x => x.owner)) : null;
  let W = 0, H = 0;
  people.forEach(p => { const q = P(p.id); if (q) { W = Math.max(W, q.x + NW + 30); H = Math.max(H, q.y + NH + 30); } });
  W = Math.max(W, 640); H = Math.max(H, 200);
  // 背景：所属の列（lanes）または木ごとのまとまり（tree）、階層の見出し
  let under = '';
  if (mode === 'lanes') {
    auto.lanes.forEach(l => { under += `<rect x="${auto.laneX[l]}" y="0" width="${auto.laneW[l]}" height="${Math.max(H, auto.H)}" rx="16" class="lane lane-${l}"/><text x="${auto.laneX[l] + auto.laneW[l] / 2}" y="26" text-anchor="middle" class="lane-name" fill="${orgColor(l)}">${esc(t('orgType.' + l))}</text>`; });
  } else {
    auto.groups.forEach(gp => {
      const ps = gp.members.map(P).filter(Boolean); if (!ps.length) return;
      const x0 = Math.min(...ps.map(q => q.x)) - 12, y0 = Math.min(...ps.map(q => q.y)) - 36, x1 = Math.max(...ps.map(q => q.x)) + NW + 12, y1 = Math.max(...ps.map(q => q.y)) + NH + 14;
      under += `<rect x="${x0}" y="${y0}" width="${x1 - x0}" height="${y1 - y0}" rx="18" class="lane lane-${laneOf(gp.root)}"/><text x="${x0 + 14}" y="${y0 + 22}" class="lane-name" fill="${orgColor(laneOf(gp.root))}">${esc(t('orgType.' + laneOf(gp.root)))}</text>`;
    });
  }
  const depthY = {}; people.forEach(p => { const q = P(p.id); if (!q || over[p.id]) return; const d = auto.pos[p.id] ? auto.pos[p.id].d : 0; depthY[d] = Math.min(depthY[d] ?? 1e9, q.y); });
  Object.entries(depthY).forEach(([d, y]) => { under += `<text x="10" y="${y + NH / 2 - 3}" class="level-name">${esc(t('org.level', +d + 1))}</text><text x="10" y="${y + NH / 2 + 12}" class="level-sub">${esc(t('org.levelName.' + Math.min(+d, 3)))}</text>`; });
  // ノード（人のカード）
  const nodes = people.map(p => {
    const q = P(p.id); if (!q) return null;
    const ld = personLoad(p.name, b, alerts), cap = state.settings.overloadCount, ratio = Math.min(1, ld.tasks.length / Math.max(1, cap));
    const cls = 'org-node' + (inPhase && !inPhase.has(p.name) ? ' dim' : '') + (p.id === ui.orgSel ? ' on' : '') + (p.id === myId() ? ' me' : '');
    return {id: p.id, x: q.x, y: q.y, w: NW, h: NH, cls, delay: (q.d || 0) * 80, body: `
      <rect width="${NW}" height="${NH}" rx="14" class="org-card"/>
      <circle cx="22" cy="24" r="13" fill="${orgColor(p.org)}"/><text x="22" y="28.5" text-anchor="middle" class="org-ini">${esc((p.name || '?').slice(0, 1))}</text>
      <text x="42" y="21" class="org-name">${esc((p.name || '—').slice(0, 7))}</text>
      <text x="42" y="37" class="org-role">${esc((p.role || '').slice(0, 9))}</text>
      <text x="${NW - 10}" y="21" text-anchor="end" class="org-access ${p.access}">${esc(t('roleShort.' + (p.access || 'member')))}</text>
      <rect x="10" y="${NH - 15}" width="${NW - 20}" height="5" rx="2.5" class="load-bg"/><rect x="10" y="${NH - 15}" width="${(NW - 20) * ratio}" height="5" rx="2.5" class="load-fg ${ld.tasks.length >= cap ? 'heavy' : ''}"/>
      <title>${esc(p.name)}：${esc(t('org.loadShort', ld.tasks.length, ld.acts.length, ld.raid.length))}</title>
      ${ld.high ? `<circle cx="${NW - 4}" cy="4" r="9" class="org-alert"/><text x="${NW - 4}" y="8" text-anchor="middle" class="org-alert-n">${ld.high}</text>` : ''}`};
  }).filter(Boolean);
  // 辺：報告ライン（縦の関係）と連携（横の関係）
  const edges = [];
  people.forEach(p => { if (inSet.has(p.parentId)) edges.push({id: 'r:' + p.id, from: p.parentId, to: p.id, kind: 'report', style: auto.stacked && auto.stacked.has(p.id) && !over[p.id] && !over[p.parentId] ? 'rail' : ''}); });
  const seenPeer = new Set();
  people.forEach(p => peersOf(p.id).forEach(q => { const k = [p.id, q].sort().join('|'); if (!inSet.has(q) || seenPeer.has(k)) return; seenPeer.add(k); edges.push({id: 'p:' + k, from: p.id, to: q, kind: 'peer'}); }));
  const hasOver = Object.keys(over).length > 0;
  v.innerHTML = `<div class="card org-canvas">
    <div class="bar">
      <div class="seg">${['tree','lanes'].map(k => `<button class="${mode === k ? 'on' : ''}" data-olayout="${k}">${t('org.layout.' + k)}</button>`).join('')}</div>
      <div class="legend" style="margin:0">
        <span><svg width="28" height="10" style="overflow:visible"><path d="M1 5H22" class="dg-legend rep"/></svg>${t('org.lgReport')}</span>
        <span><svg width="28" height="10"><path d="M1 5H27" class="dg-legend peer"/></svg>${t('org.lgPeer')}</span>
        <span><svg width="28" height="10"><rect x="1" y="3" width="26" height="5" rx="2.5" class="load-fg"/></svg>${t('org.lgLoad', state.settings.overloadCount)}</span>
        <span><i class="dot-red"></i>${t('org.highAlerts')}</span>
      </div>
      <span class="sp"></span>${caption || ''}
      ${canCreate('org') ? `<button class="btn ${edit ? 'primary' : ''}" id="dgEdit">${edit ? '✓ ' + t('dg.editOn') : '✎ ' + t('dg.edit')}</button>` : ''}
      ${edit ? `<button class="btn" id="dgAddPerson">＋ ${t('dg.addMember')}</button>${hasOver ? `<button class="btn" id="dgAuto">${t('dg.autoLayout')}</button>` : ''}` : ''}
    </div>
    <div class="muted small" style="margin-bottom:8px">${edit ? t('dg.hintOrg') : (inPhase ? t('org.phaseHint', phaseName(ui.scope)) + '　' : '') + t('org.hoverHint')}</div>
    <div id="orgDiagram"></div>
  </div>`;
  if (!people.length) { $('#orgDiagram').innerHTML = `<div class="empty">${t('org.empty')}</div>`; }
  else diagram($('#orgDiagram'), {
    W, H, nodes, edges, under, edit, selected: ui.orgSel, label: t('tab.org'), cls: 'org-svg' + ($('#view').classList.contains('animate') ? ' anim' : ''),
    handles: [{kind: 'report', at: 'bottom', title: t('dg.handleReport')}, {kind: 'peer', at: 'right', title: t('dg.handlePeer')}],
    related: orgRelated,
    onNode: id => { ui.orgSel = id; ui.flowStep = ''; ui.chartEditing = ''; render(); },
    onMove: (id, x, y) => { state.layouts[key] = {...(state.layouts[key] || {}), [id]: {x, y, d: (P(id) || {}).d || 0}}; save(); render(); },
    onConnect: (from, to, kind) => {
      const a = state.org.find(p => p.id === from), c = state.org.find(p => p.id === to);
      if (kind === 'report') {
        // 線を引いた先の人が、元の人の上司（またはその上）なら循環になるので断る
        let x = a, guard = 0; while (x && guard++ < 60) { if (x.id === c.id) { toast(t('dg.cycle')); return; } x = state.org.find(p => p.id === x.parentId); }
        c.parentId = a.id; toast(t('dg.reportSet', c.name, a.name));
      } else {
        if (peersOf(a.id).includes(c.id)) { toast(t('dg.peerExists')); return; }
        a.peers = (a.peers || []).concat(c.id); toast(t('dg.peerAdded', a.name, c.name));
      }
      save(); render();
    },
    onEdge: (e, cx, cy) => {
      const a = state.org.find(p => p.id === e.from), c = state.org.find(p => p.id === e.to);
      dgPopover(cx, cy, `<div class="small muted">${esc(a.name)} → ${esc(c.name)}</div><button class="btn danger sm" data-x>${e.kind === 'report' ? t('dg.removeReport') : t('dg.removePeer')}</button>`, (m, close) => {
        m.querySelector('[data-x]').onclick = () => {
          if (e.kind === 'report') c.parentId = ''; else { a.peers = (a.peers || []).filter(x => x !== c.id); c.peers = (c.peers || []).filter(x => x !== a.id); }
          close(); save(); render();
        };
      });
    },
    onCanvas: (x, y) => addMemberAt(key, x, y),
  });
  v.querySelectorAll('[data-olayout]').forEach(el => el.onclick = () => { ui.orgLayout = el.dataset.olayout; render(true); });
  const de = $('#dgEdit'); if (de) de.onclick = () => { ui.diagEdit = !ui.diagEdit; render(); };
  const ap = $('#dgAddPerson'); if (ap) ap.onclick = () => addMemberAt(null);
  const au = $('#dgAuto'); if (au) au.onclick = () => { delete state.layouts[key]; save(); render(true); };
}
// 図の上からメンバーを追加（メンバー一覧からの追加と同じデータになる）
function addMemberAt(key, x, y){
  const parent = state.org.find(p => p.id === ui.orgSel) || state.org.find(p => p.access === 'pm');
  const n = {id: nextId('O', state.org), name: t('org.newName'), role: '', access: 'member', org: parent ? parent.org : 'us', parentId: parent ? parent.id : '', note: '', peers: []};
  state.org.push(n); (state.charts || []).forEach(c => { if (ui.orgView === 'chart:' + c.id) c.members.push(n.id); });
  if (key && x != null) { state.layouts[key] = {...(state.layouts[key] || {}), [n.id]: {x, y}}; }
  ui.orgSel = n.id; save(); render();
}
// 人の詳細パネル（どの図からでも開ける）の操作
function bindPersonDrawer(root, sel){
  const blank = (name, org, parentId) => ({id: nextId('O', state.org), name, role: '', access: 'member', org, parentId, note: '', peers: []});
  const addChild = root.querySelector('#addChild'); if (addChild) addChild.onclick = () => { const n = blank(t('org.newName'), sel.org, sel.id); state.org.push(n); ui.orgSel = n.id; save(); render(); };
  // 案内コードは本人の初回ログインにだけ使える。本人が自分でパスコードを決めた時点で無効になる
  const inv = root.querySelector('#copyInvite'); if (inv) inv.onclick = async () => {
    let code = '';
    if (!sel.pin) { code = newInviteCode(); sel.invite = await makeSecret(code); save(); }
    copyText(inviteText(sel, code)); render();
  };
  root.querySelectorAll('[data-phase-owner]').forEach(el => el.onchange = () => {
    if (!canCreate('phases')) return;

  });
  // 連携相手：記録は片方に持たせ、外すときは両方から外す
  root.querySelectorAll('[data-peer]').forEach(el => el.onchange = () => {
    if (!canCreate('org')) return;
    const q = el.dataset.peer, other = state.org.find(x => x.id === q);
    sel.peers = (sel.peers || []).filter(x => x !== q); if (other) other.peers = (other.peers || []).filter(x => x !== sel.id);
    if (el.checked) sel.peers.push(q);
    save(); render();
  });
}
function personPanel(p, b, alerts){
  const f = (k, o) => fld('org', p.id, k, p[k], o);
  const ld = personLoad(p.name, b, alerts);
  const desc = new Set(); const walk = id => state.org.filter(x => x.parentId === id).forEach(x => { if (!desc.has(x.id)) { desc.add(x.id); walk(x.id); } }); walk(p.id);
  const parents = state.org.filter(x => x.id !== p.id && !desc.has(x.id)).map(x => [x.id, `${x.name}${x.role ? '（' + x.role + '）' : ''}`]);

    <div class="bar" style="margin-bottom:6px"><span class="avatar sm" style="background:${orgColor(p.org)}">${esc((p.name || '?').slice(0, 1))}</span><h2 style="margin:0">${esc(p.name)}</h2><span class="sp"></span>${delBtn('org', p.id, p.name)}<button class="btn ghost" id="drawerClose" title="${t('org.close')}">✕</button></div>

      <label>${t('org.type')}${f('org', {type: 'select', opts: ORG_LANES.map(o => [o, t('orgType.' + o)])})}</label>
      <label>${t('org.parent')}${f('parentId', {type: 'select', opts: parents, blank: t('org.top')})}</label>
      <div class="lbl-block">${t('org.peers')}<div class="phase-checks peers">${peerCands.map(x => `<label class="chk"><input type="checkbox" data-peer="${x.id}" ${peersOf(p.id).includes(x.id) ? 'checked' : ''} ${canCreate('org') ? '' : 'disabled'}> ${esc(x.name)} <span class="muted small">${esc(x.role || t('orgType.' + laneOf(x)))}</span></label>`).join('') || `<span class="muted small">${t('org.peersNone')}</span>`}</div></div>
      <label>${t('org.note')}${f('note', {type: 'textarea', rows: 2, ph: t('org.notePh')})}</label>
    </div>
    <div class="bar" style="margin-top:10px"><button class="btn" id="addChild">＋ ${t('org.addChild')}</button>
      ${myRole() === 'pm' && p.id !== myId() ? `<button class="btn primary" id="copyInvite" title="${t('org.inviteHint')}">${p.pin ? t('org.inviteAgain') : t('org.invite')}</button>` : ''}</div>
    <div class="login-state ${loginStatus(p)}">${t('org.login.' + loginStatus(p))}</div>
    <h3>${t('org.holding')}</h3>
    ${ld.tasks.length + ld.acts.length + ld.raid.length ? `<ul class="hold-list">
      ${ld.tasks.map(x => row(t('org.kTask'), x.name, x.end, d2n(x.end) < b)).join('')}
      ${ld.acts.map(a => row(t('org.kAction'), a.text, a.due, a.due && d2n(a.due) < b)).join('')}

  </div>`;
}

// ロールとできることの一覧（ロールを選ぶだけで権限が決まることを見せる）
function roleMatrix(){

<script>

'use strict';
// ============ 体制図：図の切り替え（組織図・フロー・カスタム）とメンバー一覧 ============
// 図は「見て分かる」ための画面、メンバーの追加・編集は「メンバー一覧」に分ける。

// ---- フローのひな形（ガバナンスのルールを参照し、体制図の人から担当を自動で割り当てる） ----
function pickPeople(){
  const org = state.org, depth = orgDepth(org);
  const pm = org.find(p => p.access === 'pm');
  const clients = org.filter(p => laneOf(p) === 'client').sort((a, b) => depth[a.id] - depth[b.id]);
  const clientTop = clients[0], clientPL = clients.find(p => depth[p.id] === depth[(clientTop || {}).id] + 1) || clientTop;
  const clientLead = clients.find(p => clientPL && p.parentId === clientPL.id) || clientPL;
  const lead = org.find(p => p.access === 'lead') || pm;
  const ids = (...ps) => ps.filter(Boolean).map(p => p.id).filter((x, i, a) => a.indexOf(x) === i);
  return {pm, clientTop, clientPL, clientLead, lead, ids};
}
function flowTemplates(){
  const J = LANG() === 'ja', T = (ja, en) => J ? ja : en, P = pickPeople();
  const st = (id, label, people, note, type) => ({id, label, people, note: note || '', type: type || 'step'});
  const ed = (from, to, label) => ({id: `E${from}${to}`, from, to, label: label || ''});
  return {
    cr: {name: T('CRフロー','CR flow'), gov: 'cr', steps: [
      st('S1', T('起票','Raise'), [], T('依頼者（誰でも起票できる）','Requester (anyone)')),
      st('S2', T('影響分析','Impact analysis'), P.ids(P.pm), T('スコープ・日程・費用・品質への影響','Scope / schedule / cost / quality')),
      st('S3', T('変更管理会議（CCB）で判断','Decision at CCB'), P.ids(P.clientPL, P.pm), T('承認／却下を決める','Approve or reject'), 'decision'),
      st('S4', T('計画へ反映','Update the plan'), P.ids(P.pm), T('WBS・CR台帳を更新','Update WBS and CR log')),
      st('S5', T('関係者へ周知','Communicate'), P.ids(P.pm), T('週次定例・週次報告で共有','Share in weekly meeting / report'), 'end'),
      st('S6', T('依頼者へ回答（却下）','Reply to requester (rejected)'), P.ids(P.pm), T('理由を添えて回答し、台帳をクローズ','Reply with reasons, close the CR'), 'end'),
    ], edges: [ed('S1','S2'), ed('S2','S3'), ed('S3','S4', T('承認','Approved')), ed('S4','S5'), ed('S3','S6', T('却下','Rejected'))]},
    approval: {name: T('成果物の承認フロー','Deliverable approval flow'), gov: 'approval', steps: [
      st('S1', T('作成（v0.x）','Draft (v0.x)'), [], T('担当メンバー','Author')),
      st('S2', T('チーム内レビュー','Peer review'), P.ids(P.lead), T('指摘はレビュー記録へ','Comments in review record')),
      st('S3', T('PMレビュー','PM review'), P.ids(P.pm), T('完了の定義（DoD）を確認','Check Definition of Done')),
      st('S4', T('顧客レビュー','Client review'), P.ids(P.clientLead), T('原則5営業日','5 business days'), 'decision'),

    ], edges: [ed('S1','S2'), ed('S2','S3'), ed('S3','S4'), ed('S4','S5', T('OK','OK')), ed('S4','S1', T('差し戻し','Rework'))]},
    escalation: {name: T('エスカレーション','Escalation path'), gov: 'escalation', steps: [
      st('S1', T('レベル1：担当者間で解決','Level 1: owners'), [], T('2営業日以内','Within 2 business days')),
      st('S2', T('レベル2：PM ↔ 顧客PL','Level 2: PM ↔ client PL'), P.ids(P.pm, P.clientPL), T('週次定例または随時','Weekly meeting or ad hoc')),
      st('S3', T('レベル3：ステアリングコミッティ','Level 3: Steering committee'), P.ids(P.clientTop, P.pm), T('重要度「高」で解決しない場合','High severity, still unresolved'), 'decision'),
      st('S4', T('解決・決定事項に記録','Resolved — log the decision'), P.ids(P.pm), '', 'end'),
    ], edges: [ed('S1','S2', T('2営業日で未解決','Unresolved in 2 days')), ed('S2','S3', T('3営業日で未解決','Unresolved in 3 days')), ed('S1','S4', T('解決','Resolved')), ed('S2','S4', T('解決','Resolved')), ed('S3','S4', T('決定','Decided'))]},
  };
}
function ensureFlows(){
  state.flows = state.flows || []; state.charts = state.charts || [];
  if (!state.flows.length && state.org.length) {
    const tp = flowTemplates();
    ['cr','approval','escalation'].forEach((k, i) => state.flows.push({id: 'F0' + (i + 1), kind: k, ...tp[k]}));

// ---- 右側の詳細パネル（人／フローのステップ／カスタム図の設定） ----

  const d = $('#orgDrawer'); if (!d) return;

  if (sel) { d.innerHTML = personPanel(sel, ctx.b, ctx.alerts); bindPersonDrawer(d, sel); }
